  player.yaw=Math.atan2(v.look[1]-v.p[1],v.look[0]-v.p[0]); player.pitch=v.pitch??-0.06;
  hintText.innerHTML= isTouch ? 'Drag to look around · use the arrows to walk' : 'Drag to look · <b>W A S D</b> or arrows to walk · <b>Shift</b> to run'; pad.hidden=!isTouch; }
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{setView(b.dataset.view); renderer.domElement.focus();}));
// look by dragging (walk mode)
let drag=null;
renderer.domElement.addEventListener('pointerdown',e=>{ if(mode!=='walk')return; drag={x:e.clientX,y:e.clientY,id:e.pointerId}; renderer.domElement.setPointerCapture(e.pointerId); });
renderer.domElement.addEventListener('pointermove',e=>{ if(!drag||e.pointerId!==drag.id)return; const k=isTouch?0.005:0.0035;
  player.yaw+= (e.clientX-drag.x)*k; player.pitch=Math.max(-1.2,Math.min(1.1,player.pitch-(e.clientY-drag.y)*k)); drag.x=e.clientX; drag.y=e.clientY; });
const endDrag=e=>{ if(drag&&e.pointerId===drag.id) drag=null; };
renderer.domElement.addEventListener('pointerup',endDrag); renderer.domElement.addEventListener('pointercancel',endDrag);
const keys=new Set();
addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT')return; const k=e.key.toLowerCase(); if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright','shift'].includes(k)){ keys.add(k); if(mode==='walk') e.preventDefault(); }});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase())); addEventListener('blur',()=>keys.clear());
const padKeys=new Set();
pad.querySelectorAll('button').forEach(b=>{ const k=b.dataset.k; const on=e=>{e.preventDefault();padKeys.add(k);}; const off=()=>padKeys.delete(k);
  b.addEventListener('pointerdown',on); b.addEventListener('pointerup',off); b.addEventListener('pointerleave',off); b.addEventListener('pointercancel',off); });

// ---------- options ----------
const bindToggle=(id,obj)=>document.getElementById(id).addEventListener('change',e=>{obj.visible=e.target.checked;});
document.getElementById('optRoof').addEventListener('change',e=>{roofG.visible=e.target.checked; croofG.visible=e.target.checked;}); bindToggle('optLine',lineG); bindToggle('optCtx',ctx);
document.getElementById('optSun').addEventListener('input',e=>setSun(parseFloat(e.target.value)));
function setMode(m){ if(m===true) m='A'; if(m===false) m='existing'; designMode=m==='D'; concept=m==='A'||m==='B'; conceptG.visible=concept; exG.visible=m==='existing'; designG.visible=designMode; ctx.visible=!designMode&&document.getElementById('optCtx').checked; lineG.visible=!designMode&&document.getElementById('optLine').checked; designG.userData.lights.forEach(l=>l.visible=designMode);
  aG.visible=m==='A'; bG.visible=m==='B'; conceptB=m==='B'; activeBX=m==='B'?[]:BX;
  roomLights.forEach(l=>l.visible=m==='existing'); unitLights.forEach(l=>l.visible=concept); aG.userData.lights.forEach(l=>l.visible=m==='A'); bG.userData.lights.forEach(l=>l.visible=m==='B');
  document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===m)));
  document.querySelectorAll('[data-set]').forEach(el=>el.hidden=el.dataset.set!==(m==='existing'?'existing':m==='A'?'concept':m==='B'?'conceptB':m==='D'?'design':'none'));
  document.getElementById('subT').textContent=m==='A'?'Concept B (backup) · 4 loft bungalows + main house with 2 apartments':m==='B'?'Concept A · 3 bungalows (4 × 9 m + loft) + main house with 2 apartments':m==='D'?'Bungalow design · 4 × 9 m, runs north–south, open to the west':'Existing · 3D model v0.6 · photo-checked'; setView('overview'); }
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
window.__setMode=setMode;

// ---------- loop ----------
const clock=new THREE.Clock(); const tmp=new THREE.Vector3(), tmp2=new THREE.Vector3();
function frame(){
  const dt=Math.min(clock.getDelta(),0.05);
  if(mode==='walk'){
    const fwd=(keys.has('w')||keys.has('arrowup')||padKeys.has('f')?1:0)-(keys.has('s')||keys.has('arrowdown')||padKeys.has('b')?1:0);
    let str=(keys.has('d')||padKeys.has('r')?1:0)-(keys.has('a')||padKeys.has('l')?1:0);
    if(keys.has('arrowleft')) player.yaw-=1.8*dt; if(keys.has('arrowright')) player.yaw+=1.8*dt;
    if(fwd||str){ const sp=(keys.has('shift')?3.2:1.5)*dt; const cx=Math.cos(player.yaw),cz=Math.sin(player.yaw);
      const mx=(cx*fwd - cz*str)*sp, mz=(cz*fwd + cx*str)*sp;
      if(!tryMove(player.x+mx,player.z+mz)){ tryMove(player.x+mx,player.z) || tryMove(player.x,player.z+mz); } }
    if(player.targetFeet!==undefined) player.feet+= (player.targetFeet-player.feet)*Math.min(1,dt*10);
    const eye=((concept&&!conceptB&&player.feet>2.5&&player.feet<3.5)||((conceptB||designMode)&&player.feet>=UB.LF-.01))?1.15:EYE;   // sitting / kneeling eye height in the lofts
    tmp.set(player.x,player.feet+eye,player.z); site.localToWorld(tmp); camera.position.copy(tmp);
    tmp2.set(player.x+Math.cos(player.yaw)*Math.cos(player.pitch), player.feet+eye+Math.sin(player.pitch), player.z+Math.sin(player.yaw)*Math.cos(player.pitch)); site.localToWorld(tmp2); camera.lookAt(tmp2);
    const ft=player.feet; const fl=ft>4?'upper floor (+4.2 m)':ft>2.2?'sleeping loft':ft>0.9?'house floor (+1.0 m)':ft>0.6?'pool edge (+0.65 m)':ft>0.3?(concept?'deck / bungalow floor (+0.35–0.45 m)':'deck (+0.35 m)'):'ground';
    where.textContent=`on ${fl}`;
  } else if(mode==='orbit'){ orbit.update(); where.textContent=''; }
  renderer.render(scene,camera); requestAnimationFrame(frame);
}
function resize(){ const w=stage.clientWidth,h=stage.clientHeight; renderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix(); }
addEventListener('resize',resize);
setView(location.hash==='#walk'?'terrace':'overview');
window.__setView=setView;
// test hook: free camera in site-local coords (x along north boundary, y up, z across to the south)
window.__cam=(p,look,fov=60,opts={})=>{ mode='free'; orbit.enabled=false; camera.fov=fov; camera.updateProjectionMatrix();
  camera.position.copy(site.localToWorld(new THREE.Vector3(...p))); camera.lookAt(site.localToWorld(new THREE.Vector3(...look)));
  if(opts.roof!==undefined) roofG.visible=opts.roof; if(opts.ctx!==undefined) ctx.visible=opts.ctx; if(opts.sun!==undefined) setSun(opts.sun);
  document.querySelectorAll('.ui').forEach(e=>e.style.display=opts.ui?'':'none'); renderer.render(scene,camera); };
window.__site=site; window.__ready=true;
frame();
</script>
